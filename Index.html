<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Noto Sans KR',-apple-system,sans-serif;color:#111;background:#fff;line-height:1.6}
.container{max-width:1200px;margin:0 auto;padding:0 24px}
header{position:sticky;top:0;z-index:1000;background:rgba(255,255,255,0.95);backdrop-filter:blur(10px);border-bottom:1px solid #eee}
.nav{height:72px;display:flex;align-items:center;justify-content:space-between}
.logo{font-weight:800;font-size:18px}
.badge{font-size:10px;letter-spacing:0.18em;color:rgba(0,0,0,0.4);margin-top:2px;font-weight:500}
section{padding:72px 0}
#funeral-map{background:#F8F5F0}
#columbarium-map{background:#fff;border-top:1px solid rgba(0,0,0,0.05)}
.serif{font-family:'Noto Serif KR',serif}
.h-title{font-size:32px;font-weight:600;letter-spacing:-0.02em;line-height:1.15}
.pill{display:inline-flex;padding:4px 12px;border-radius:999px;background:rgba(0,0,0,0.05);font-size:11px;letter-spacing:0.12em}
.filter-btn{height:32px;padding:0 16px;border-radius:999px;font-size:13px;border:1px solid rgba(0,0,0,0.1);background:#fff;color:rgba(0,0,0,0.6);cursor:pointer;transition:all .2s}
.filter-btn.active{background:#000;color:#fff;border-color:#000}
.input-wrap{position:relative;max-width:520px;flex:1}
.input-wrap input{width:100%;height:48px;border-radius:999px;background:#F8F5F0;border:1px solid rgba(0,0,0,0.1);padding:0 16px 0 44px;font-size:14px;outline:none}
#columbarium-map .input-wrap input{background:#F8F5F0}
.search-icon{position:absolute;left:16px;top:50%;transform:translateY(-50%);color:rgba(0,0,0,0.3)}
.map-card{margin-top:24px;border-radius:20px;overflow:hidden;border:1px solid rgba(0,0,0,0.1);background:#fff;box-shadow:0 8px 30px rgba(0,0,0,0.04)}
.map-inner{position:relative;background:#EFECE6;padding:8px}
#map-hall,#map-colum{height:420px;width:100%;border-radius:14px;z-index:1}
.map-label{position:absolute;top:16px;left:16px;z-index:400;background:rgba(255,255,255,0.95);backdrop-filter:blur(4px);padding:6px 12px;border-radius:999px;font-size:11px;border:1px solid rgba(0,0,0,0.1);display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:999px;background:#2E7D32}
.dot2{background:#2F3A2E}
.grid-cards{padding:20px;display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.card{border-radius:14px;border:1px solid rgba(0,0,0,0.1);background:#FDFCFA;padding:16px;cursor:pointer;transition:all .2s}
.card.active{border-color:#000;background:#FBFAF7}
.card h4{font-family:'Noto Serif KR',serif;font-size:14px;font-weight:600;line-height:1.3}
.card .meta{margin-top:12px;font-size:12px;color:rgba(0,0,0,0.6);line-height:1.6}
.card .meta span{color:rgba(0,0,0,0.3);display:inline-block;width:36px}
.card-actions{margin-top:12px;padding-top:12px;border-top:1px solid rgba(0,0,0,0.05);display:flex;justify-content:space-between;align-items:center}
.link-naver{font-size:11px;padding:4px 10px;border-radius:999px;background:#03C75A;color:#fff;text-decoration:none}
.link-naver:hover{background:#02b351}
.btn-text{font-size:11px;text-decoration:underline;text-underline-offset:4px;background:none;border:none;cursor:pointer}
@media(max-width:900px){.grid-cards{grid-template-columns:1fr}.h-title{font-size:28px}}

<body>
<header>
<div class="container nav">
<div><div class="logo" title="상례예산정보원">상례예산정보원</div><div class="badge">Premium Memorial Consulting</div></div>
<nav style="display:flex;gap:8px;font-size:14px">
<button class="filter-btn" onclick="document.getElementById('funeral-map').scrollIntoView({behavior:'smooth'})">전국 장례식장 위치</button>
<button class="filter-btn" onclick="document.getElementById('columbarium-map').scrollIntoView({behavior:'smooth'})">납골당 위치</button>
</nav>
</div>
</header>

<section id="funeral-map">
<div class="container">
<div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:16px;align-items:flex-end">
<div>
<div class="pill">01 — FUNERAL HALL MAP</div>
<h2 class="serif h-title" style="margin-top:12px">전국 장례식장 위치</h2>
</div>
<div id="funeral-filters" style="display:flex;gap:8px;flex-wrap:wrap"></div>
</div>

<div style="margin-top:24px;display:flex;gap:12px;flex-wrap:wrap;align-items:center">
<div class="input-wrap"><span class="search-icon">⌕</span><input id="funeralSearch" placeholder="장례식장 이름을 입력하세요 (예: 서울아산)" oninput="filterFuneral()"></div>
<div style="font-size:12px;color:rgba(0,0,0,0.4)"><span id="funeralCount" style="background:#000;color:#fff;padding:4px 10px;border-radius:999px;font-size:11px">8개 검색됨</span> <span style="margin-left:8px">OpenStreetMap 기반</span></div>
</div>

<div class="map-card">
<div class="map-inner">
<div id="map-hall"></div>
<div class="map-label"><span class="dot"></span> Leaflet · OpenStreetMap · <span id="mapHallLabel">8개 장례식장 위치</span></div>
</div>
<div id="funeralCards" class="grid-cards"></div>
</div>
</div>
</section>

<section id="columbarium-map">
<div class="container">
<div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:16px;align-items:flex-end">
<div>
<div class="pill">02 — COLUMBARIUM MAP</div>
<h2 class="serif h-title" style="margin-top:12px">납골당 위치</h2>
<p style="margin-top:8px;font-size:12px;color:rgba(0,0,0,0.4)">OpenStreetMap 기반 · API 키 없이 즉시 동작</p>
</div>
<div style="font-size:12px"><span id="columCount" style="background:#000;color:#fff;padding:4px 10px;border-radius:999px;font-size:11px">6개 시설</span></div>
</div>

<div style="margin-top:24px">
<div class="input-wrap"><span class="search-icon">⌕</span><input id="columSearch" placeholder="지역을 입력하세요 (예: 서울, 부산)" oninput="filterColum()"></div>
<div style="margin-top:8px;font-size:11px;color:rgba(0,0,0,0.4)">입력 시 지도와 카드가 동시에 필터됩니다</div>
</div>

<div class="map-card" style="background:#FAF8F5">
<div class="map-inner" style="background:#F1EDE6">
<div id="map-colum"></div>
<div class="map-label"><span class="dot dot2"></span> Leaflet · 납골당 6개 위치</div>
</div>
<div id="columCards" class="grid-cards"></div>
</div>
</div>
</section>

<footer style="background:#111;color:#999;padding:60px 0;text-align:center;font-size:14px">
<div class="container">
<a href="https://sangrye.github.io/" title="상례예산정보원" style="color:#fff;font-weight:700">상례예산정보원</a>
<p style="margin-top:12px">전국 장례식장 · 납골당 · 상조 비교 정보 제공</p>
</div>
</footer>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
// 데이터 - 기존 파일에서 추출
const funeralData=[
{id:1,name:"서울아산병원 장례식장",region:"서울",addressGu:"서울 송파구",addressFull:"서울 송파구 올림픽로 43길 88",bins:"35개",parking:"여유",transport:"몽촌토성역 도보 12분",lat:37.526,lng:127.107},
{id:2,name:"서울성모병원 장례식장",region:"서울",addressGu:"서울 서초구",addressFull:"서울 서초구 반포대로 222",bins:"15개",parking:"가능",transport:"고속터미널역 도보 5분",lat:37.501,lng:127.005},
{id:3,name:"서울대학교병원 장례식장",region:"서울",addressGu:"서울 종로구",addressFull:"서울 종로구 대학로 101",bins:"12개",parking:"문의",transport:"혜화역 도보 3분",lat:37.579,lng:126.999},
{id:4,name:"세브란스병원 장례식장",region:"서울",addressGu:"서울 서대문구",addressFull:"서울 서대문구 연세로 50-1",bins:"14개",parking:"가능",transport:"신촌역 도보 6분",lat:37.562,lng:126.938},
{id:5,name:"분당서울대병원 장례식장",region:"경기",addressGu:"경기 성남시",addressFull:"경기 성남시 분당구 구미로 173번길 82",bins:"10개",parking:"여유",transport:"미금역 차량 7분",lat:37.351,lng:127.122},
{id:6,name:"가천대 길병원 장례식장",region:"인천",addressGu:"인천 남동구",addressFull:"인천 남동구 남동대로 774번길 21",bins:"11개",parking:"넉넉",transport:"예술회관역 도보 10분",lat:37.449,lng:126.742},
{id:7,name:"대전성모병원 장례식장",region:"충청",addressGu:"대전 중구",addressFull:"대전 중구 대흥로 64",bins:"9개",parking:"가능",transport:"중구청역 도보 4분",lat:36.321,lng:127.425},
{id:8,name:"부산대학교병원 장례식장",region:"영남",addressGu:"부산 서구",addressFull:"부산 서구 구덕로 179",bins:"13개",parking:"여유",transport:"토성역 도보 8분",lat:35.104,lng:129.026}
];
const columData=[
{id:1,name:"서울시립 승화원",location:"경기 고양시",type:"공설",form:"봉안당·자연장",lat:37.46,lng:127.03},
{id:2,name:"인천가족공원",location:"인천 부평구",type:"공설",form:"봉안당·수목장",lat:37.51,lng:126.71},
{id:3,name:"분당 메모리얼파크",location:"경기 성남시",type:"사설",form:"봉안당",lat:37.35,lng:127.12},
{id:4,name:"용인 평온의 숲",location:"경기 용인시",type:"사설",form:"수목장·잔디장",lat:37.23,lng:127.17},
{id:5,name:"서천 추모공원",location:"충남 서천군",type:"공설",form:"봉안당·자연장",lat:36.08,lng:126.69},
{id:6,name:"부산 영락공원",location:"부산 금정구",type:"공설",form:"봉안당",lat:35.2,lng:129.09}
];

let currentRegion="전체";
const regions=["전체","서울","경기","인천","충청","영남"];
const funeralFiltersEl=document.getElementById('funeral-filters');
regions.forEach(r=>{
 const btn=document.createElement('button');
 btn.className='filter-btn'+(r===currentRegion?' active':'');
 btn.textContent=r;
 btn.onclick=()=>{currentRegion=r;document.querySelectorAll('#funeral-filters .filter-btn').forEach(b=>b.classList.remove('active'));btn.classList.add('active');filterFuneral();};
 funeralFiltersEl.appendChild(btn);
});

let mapHall, mapColum;
let funeralMarkers=new Map();
let columMarkers=new Map();
let activeFuneralId=null, activeColumId=null;

function initMaps(){
 mapHall=L.map('map-hall').setView([36.8,127.8],7);
 L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap'}).addTo(mapHall);
 mapColum=L.map('map-colum').setView([36.8,127.8],7);
 L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap'}).addTo(mapColum);

 funeralData.forEach(item=>{
   const m=L.marker([item.lat,item.lng]).addTo(mapHall).bindPopup(`<b>${item.name}</b><br/>${item.addressFull}<br/><a href="https://map.naver.com/p/search/${encodeURIComponent(item.name)}" target="_blank">네이버지도에서 보기</a>`);
   funeralMarkers.set(item.id,m);
 });
 columData.forEach(item=>{
   const m=L.marker([item.lat,item.lng]).addTo(mapColum).bindPopup(`<b>${item.name}</b><br/>${item.location}<br/>${item.form}`);
   columMarkers.set(item.id,m);
 });
}

function getFilteredFuneral(){
 let list=funeralData;
 if(currentRegion!=="전체") list=list.filter(x=>x.region===currentRegion);
 const q=document.getElementById('funeralSearch').value.trim();
 if(q) list=list.filter(x=>x.name.includes(q)||x.addressGu.includes(q)||x.addressFull.includes(q));
 return list;
}
function getFilteredColum(){
 let list=columData;
 const q=document.getElementById('columSearch').value.trim();
 if(q) list=list.filter(x=>x.location.includes(q)||x.name.includes(q)||x.form.includes(q));
 return list;
}

function filterFuneral(){
 const list=getFilteredFuneral();
 document.getElementById('funeralCount').textContent=list.length+"개 검색됨";
 document.getElementById('mapHallLabel').textContent=list.length+"개 장례식장 위치";
 // markers visibility
 funeralMarkers.forEach((marker,id)=>{
   if(list.find(x=>x.id===id)){ if(!mapHall.hasLayer(marker)) marker.addTo(mapHall); } else { if(mapHall.hasLayer(marker)) mapHall.removeLayer(marker); }
 });
 if(list.length>0){ mapHall.panTo([list[0].lat,list[0].lng],{animate:true}); }
 renderFuneralCards(list);
}

function filterColum(){
 const list=getFilteredColum();
 document.getElementById('columCount').textContent=list.length+"개 시설";
 columMarkers.forEach((marker,id)=>{
   if(list.find(x=>x.id===id)){ if(!mapColum.hasLayer(marker)) marker.addTo(mapColum); } else { if(mapColum.hasLayer(marker)) mapColum.removeLayer(marker); }
 });
 if(list.length>0 && document.getElementById('columSearch').value.trim()!==""){ mapColum.panTo([list[0].lat,list[0].lng],{animate:true}); }
 renderColumCards(list);
}

function renderFuneralCards(list){
 const el=document.getElementById('funeralCards');
 el.innerHTML='';
 list.forEach(item=>{
   const div=document.createElement('div');
   div.className='card'+(activeFuneralId===item.id?' active':'');
   div.innerHTML=`<div style="display:flex;justify-content:space-between;gap:8px"><div class="serif" style="font-weight:600;font-size:14px">${item.name}</div><span style="font-size:10px;padding:2px 8px;border-radius:999px;background:#000;color:#fff">${item.region}</span></div>
   <div class="meta"><div><span>위치</span>${item.addressFull}</div><div><span>빈소</span>${item.bins} · 주차 ${item.parking}</div><div><span>교통</span>${item.transport}</div></div>
   <div class="card-actions"><button class="btn-text" onclick="focusFuneral(${item.id})">지도에서 보기</button><a class="link-naver" href="https://map.naver.com/p/search/${encodeURIComponent(item.name)}" target="_blank" title="상례예산정보원 - 네이버지도">네이버지도</a></div>`;
   div.onclick=(e)=>{ if(e.target.tagName==='A'||e.target.tagName==='BUTTON') return; focusFuneral(item.id); };
   el.appendChild(div);
 });
 if(list.length===0) el.innerHTML='<div style="grid-column:1/-1;text-align:center;padding:32px;color:rgba(0,0,0,0.5)">검색 결과가 없습니다.</div>';
}
function renderColumCards(list){
 const el=document.getElementById('columCards');
 el.innerHTML='';
 list.forEach(item=>{
   const div=document.createElement('div');
   div.className='card'+(activeColumId===item.id?' active':'');
   div.innerHTML=`<div class="serif" style="font-weight:600;font-size:14px">${item.name}</div>
   <div class="meta"><div><span>위치</span>${item.location}</div><div><span>구분</span>${item.type}</div><div><span>형태</span>${item.form}</div></div>
   <div class="card-actions"><button class="btn-text" onclick="focusColum(${item.id})">지도에서 보기</button><a class="link-naver" href="https://map.naver.com/p/search/${encodeURIComponent(item.name)}" target="_blank" title="상례예산정보원 - 네이버지도">네이버지도</a></div>`;
   div.onclick=(e)=>{ if(e.target.tagName==='A'||e.target.tagName==='BUTTON') return; focusColum(item.id); };
   el.appendChild(div);
 });
 if(list.length===0) el.innerHTML='<div style="grid-column:1/-1;text-align:center;padding:32px;color:rgba(0,0,0,0.5)">검색 결과가 없습니다.</div>';
}
function focusFuneral(id){
 activeFuneralId=id;
 const item=funeralData.find(x=>x.id===id);
 if(item && mapHall){ mapHall.panTo([item.lat,item.lng],{animate:true}); funeralMarkers.get(id)?.openPopup(); }
 renderFuneralCards(getFilteredFuneral());
}
function focusColum(id){
 activeColumId=id;
 const item=columData.find(x=>x.id===id);
 if(item && mapColum){ mapColum.panTo([item.lat,item.lng],{animate:true}); columMarkers.get(id)?.openPopup(); }
 renderColumCards(getFilteredColum());
}

document.addEventListener('DOMContentLoaded',()=>{
 document.title="상례예산정보원";
 initMaps();
 filterFuneral();
 filterColum();
 // OG 태그 강제
 try{
  const setMeta=(name,content,attr='property')=>{ let el=document.querySelector(`meta[${attr}="${name}"]`); if(!el){el=document.createElement('meta'); el.setAttribute(attr,name); document.head.appendChild(el);} el.setAttribute('content',content); };
  setMeta('og:title','상례예산정보원'); setMeta('og:site_name','상례예산정보원'); setMeta('og:url','https://sangrye.github.io/');
 }catch(e){}
});
</script>
</body>
</html>
